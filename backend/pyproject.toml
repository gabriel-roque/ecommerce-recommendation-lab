[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hm-recommendation-lab"
version = "0.1.0"
description = "H&M hybrid recommendation lab"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "psutil>=6,<8",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "tensorflow>=2.16,<2.20",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
packages = ["app"]
ignore_missing_imports = true
